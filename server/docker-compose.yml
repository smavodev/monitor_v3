version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: smartmonitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartmonitor
      POSTGRES_USER: smartmonitor
      POSTGRES_PASSWORD: SmartMonitor2024!
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  headscale:
    image: headscale/headscale:v0.29.2
    container_name: smartmonitor-headscale
    restart: unless-stopped
    command: serve
    ports:
      - "8090:8090"
    volumes:
      - ./headscale-config:/etc/headscale
      - headscale_data:/var/lib/headscale

  app:
    build: ./app
    container_name: smartmonitor-app
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgresql://smartmonitor:SmartMonitor2024!@127.0.0.1:5432/smartmonitor
      SECRET_KEY: cambiar-en-produccion-clave-secreta-larga
      ADMIN_EMAIL: admin@smartmonitor.local
      ADMIN_PASSWORD: Admin2024!
      DNS_BLOCK_REDIRECT_IP: "172.27.142.107"
      HEADSCALE_URL: "http://127.0.0.1:8090"
      HEADSCALE_PUBLIC_URL: "http://172.27.142.107:8090"
      HEADSCALE_API_KEY: ""
      HEADSCALE_USER_ID: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/data
      - ./app/static:/app/static

volumes:
  db_data: {}
  app_data: {}
  headscale_data: {}
